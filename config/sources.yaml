# 信源清单
# type: rss | hn | arxiv | github
# ai_filter: true 表示该源是综合科技站，需先过 AI 关键词再入库
# weight: 打分时的基础权重，官方一手源高于媒体转载

sources:
  - id: qbitai
    name: 量子位
    type: rss
    url: "https://www.qbitai.com/feed"
    weight: 1.15
    ai_filter: false
    enabled: true

  - id: openai
    name: OpenAI
    type: rss
    url: "https://openai.com/news/rss.xml"
    weight: 1.30
    ai_filter: false
    enabled: true

  - id: googleai
    name: Google AI
    type: rss
    url: "https://blog.google/technology/ai/rss/"
    weight: 1.25
    ai_filter: false
    enabled: true

  - id: deepmind
    name: Google DeepMind
    type: rss
    url: "https://deepmind.google/blog/rss.xml"
    weight: 1.25
    ai_filter: false
    enabled: true

  - id: ithome
    name: IT之家
    type: rss
    url: "https://www.ithome.com/rss/"
    weight: 0.85
    ai_filter: true
    enabled: true

  - id: leiphone
    name: 雷峰网
    type: rss
    url: "https://www.leiphone.com/feed"
    weight: 0.95
    ai_filter: true
    enabled: true

  - id: tmtpost
    name: 钛媒体
    type: rss
    url: "https://www.tmtpost.com/rss"
    weight: 0.90
    ai_filter: true
    enabled: true

  - id: hackernews
    name: Hacker News
    type: hn
    weight: 1.00
    ai_filter: true
    min_points: 60
    max_items: 25
    enabled: true

  - id: arxiv
    name: arXiv
    type: arxiv
    weight: 0.80
    ai_filter: false
    window_hours: 48
    categories: ["cs.AI", "cs.CL", "cs.LG"]
    max_items: 12
    enabled: true

  - id: github
    name: GitHub
    type: github
    weight: 0.95
    ai_filter: false
    ignore_window: true
    days: 30
    min_stars: 800
    picks: 4
    enabled: true
    # 四个方向，每天每类最多上 1 个，保证卡片覆盖不同领域
    focus:
      - name: 汽车数据
        topics: ["automotive", "obd", "telematics", "canbus", "vehicle"]
        keywords: ["汽车", "车辆", "车载", "车机", "诊断", "obd", "telematics", "canbus"]
        queries:
          - "topic:obd stars:>80"
          - "topic:telematics stars:>15"

      - name: 新片剪辑
        recent_days: 150
        topics: ["video-editing", "video-generation", "text-to-video"]
        keywords: ["剪辑", "视频", "字幕", "配音", "video", "edit", "clip", "subtitle"]
        queries:
          - "topic:video-editing stars:>40"

      - name: 数据分析
        topics: ["text-to-sql", "data-analysis", "business-intelligence", "data-visualization"]
        keywords: ["数据", "分析", "报表", "bi", "sql", "analytics", "dashboard"]
        queries:
          - "topic:text-to-sql stars:>150"

      - name: 高热 AI
        topics: ["llm", "ai", "agents", "generative-ai"]
        keywords: ["ai", "llm", "大模型", "智能体", "agent"]
        queries:
          - "topic:llm stars:>8000"

# 综合源必须命中以下任一关键词才进入候选池
ai_keywords:
  - AI
  - AIGC
  - AGI
  - 人工智能
  - 大模型
  - 大语言模型
  - 多模态
  - 智能体
  - Agent
  - GPT
  - ChatGPT
  - Gemini
  - Claude
  - Llama
  - Qwen
  - 通义
  - 文心
  - 豆包
  - 混元
  - DeepSeek
  - 月之暗面
  - Kimi
  - 智谱
  - 商汤
  - 英伟达
  - NVIDIA
  - 算力
  - 推理芯片
  - 机器学习
  - 深度学习
  - 神经网络
  - 开源模型
  - 具身智能
  - 机器人
  - 自动驾驶
  - 生成式
  - 大模型
